<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#075fe9">
  <title>SUSÚRRAME — te escucho</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .screen-splash{background-image:none!important;background-color:#79bd2d;justify-content:space-between}
    .poster-background{position:absolute;top:0;right:0;bottom:0;left:0;z-index:0;background-image:url("assets/poster-background-textless.png");background-position:center;background-size:contain;background-repeat:no-repeat;background-color:#79bd2d}
    .poster-typography{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:contain;z-index:1;pointer-events:none;transform:translate(-115vw,-22px)}
    .screen-splash>.eyebrow,.screen-splash .apple-wrap,.screen-splash .poster-meta,.screen-splash .splash-copy{display:none}
    .poster-typography.text-enter{animation:textEnter 1.7s cubic-bezier(.42,0,.58,1) both}.poster-typography.text-exit{animation:textExit 1.7s cubic-bezier(.42,0,.58,1) both}
    .screen-splash.attention .poster-background{animation:splashJolt 4.8s ease both}
    @keyframes textEnter{0%{transform:translate(-115vw,-22px)}100%{transform:translate(0,0)}}@keyframes textExit{0%{transform:translate(0,0)}100%{transform:translate(115vw,20px)}}
    @keyframes splashJolt{0%,100%{transform:translate(0,0) rotate(0) scale(1)}10%{transform:translate(-16px,7px) rotate(-.9deg) scale(1.025)}22%{transform:translate(19px,-9px) rotate(1deg) scale(1.03)}34%{transform:translate(-20px,8px) rotate(-1.05deg) scale(1.028)}46%{transform:translate(18px,-7px) rotate(.9deg) scale(1.024)}58%{transform:translate(-15px,6px) rotate(-.75deg) scale(1.018)}70%{transform:translate(11px,-4px) rotate(.55deg) scale(1.012)}82%{transform:translate(-6px,2px) rotate(-.25deg) scale(1.005)}}
    .screen-impact{background:#b20f17!important}.stat-screen{background:#e7e4db;justify-content:space-between}.stat-kicker{font:12px monospace;letter-spacing:.12em;color:#4b555d}.stat-content{max-width:920px;margin:auto 0}.stat-number{font-size:clamp(112px,25vw,290px);font-weight:400;letter-spacing:-.1em;line-height:.8;margin:0;color:#79bd2d}.stat-unit{font-size:clamp(29px,5vw,58px);font-style:italic;line-height:.95;margin:20px 0 0;letter-spacing:-.05em}.stat-copy{font-size:clamp(23px,4vw,38px);line-height:1.02;max-width:700px;margin:28px 0 0;letter-spacing:-.045em}.stat-source{font:12px/1.35 monospace;color:#4b555d;max-width:620px}.stat-source a{color:inherit}.reset{align-self:flex-start!important;margin:32px 0 0!important;padding:26px 36px;border:2px solid #b20f17!important;border-radius:999px;text-decoration:none!important;font-size:clamp(24px,4vw,40px)!important;letter-spacing:-.045em;color:#b20f17!important}.reset:hover,.reset:focus{background:#b20f17;color:#e7e4db!important}.disclaimer{color:#4b555d}
    @media only screen and (max-width:568px), only screen and (max-device-width:568px){.screen{top:0;right:0;bottom:0;left:0;padding:28px}.poster-background,.poster-typography{top:0;right:0;bottom:0;left:0}.impact-copy{font-size:38px}.stat-number{font-size:126px}.stat-unit{font-size:31px}.stat-copy{font-size:24px}.reset{font-size:27px!important}}
  </style>
  <style>
    .screen-splash.attention .poster-background{animation:splashJoltFast 2.7s ease both}
    @keyframes splashJoltFast{0%,100%{transform:translate(0,0) rotate(0) scale(1)}10%{transform:translate(-20px,8px) rotate(-1.1deg) scale(1.03)}22%{transform:translate(24px,-11px) rotate(1.2deg) scale(1.04)}34%{transform:translate(-25px,10px) rotate(-1.25deg) scale(1.038)}46%{transform:translate(22px,-9px) rotate(1.1deg) scale(1.032)}58%{transform:translate(-18px,7px) rotate(-.9deg) scale(1.022)}70%{transform:translate(13px,-5px) rotate(.65deg) scale(1.014)}82%{transform:translate(-7px,3px) rotate(-.3deg) scale(1.006)}}
  </style>
  <style>
    .screen-report .main-phrase{font-size:clamp(42px,8vw,100px);line-height:.9;letter-spacing:-.06em;margin:0 0 28px;color:#79bd2d}
    .screen-report .stat-source{font-size:clamp(16px,2vw,24px);line-height:1.08;max-width:760px}
    .screen-report .reset{position:absolute!important;top:28px;right:28px;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:none!important;font-size:14px!important;letter-spacing:.08em;color:#b20f17!important;text-decoration:underline!important}
  </style>
</head>
<body>
  <main id="experience" class="experience state-splash" role="application" aria-label="Fuera de temporada — iPhone 4">
    <div class="grain" aria-hidden="true"></div>
    <section id="splash" class="screen screen-splash" aria-label="SUSÚRRAME — te escucho">
      <div class="poster-background" aria-hidden="true"></div>
      <img class="poster-typography" src="assets/poster-typography-overlay.png" alt="SUSÚRRAME. te escucho.">
      <button id="begin" class="touch-prompt" type="button"><span class="dot"></span><span>tocá para continuar</span></button>
    </section>
    <section class="screen screen-impact" aria-live="assertive" aria-label="Impacto">
      <div class="impact-mark">×</div><p class="eyebrow">ENTRADA REGISTRADA</p><p class="impact-copy">... todavía no acabé...</p><p class="impact-detail">respuesta háptica simulada <span>·</span> señal inestable</p>
    </section>
    <section class="screen screen-report stat-screen" aria-labelledby="stat-title">
      <p class="stat-kicker">ESCUCHA / IPHONE 4 / 8804</p>
      <div class="stat-content"><p id="stat-title" class="main-phrase">Cerca tuyo sigo activo</p><p class="stat-source">En el arte, el Bluetooth también puede convertir la proximidad de los teléfonos en una imagen en tiempo real. <a href="https://tomasmcm.design/ubication/" target="_blank" rel="noopener">fuente ↗</a></p><a id="reset" class="reset" href="#">De nuevo</a></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>FROTAME — versión básica</title>
  <style type="text/css">
    html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#f04a2b;color:#222;font-family:Arial,Helvetica,sans-serif}
    #experience{position:absolute;top:0;right:0;bottom:0;left:0;background:#f04a2b}
    .screen{position:absolute;top:0;right:0;bottom:0;left:0;padding:28px;display:none}
    #splash{display:block;background:#f04a2b url("assets/poster-background-textless.png") center center no-repeat;background-size:contain;cursor:pointer}
    #typography{position:absolute;top:0;right:0;bottom:0;left:0;background:url("assets/poster-typography-overlay.png") center center no-repeat;background-size:contain}
    #hint{position:absolute;right:28px;bottom:28px;color:#fff;font-size:12px}
    #impact{background:#e5322d;color:#fff;text-align:center}
    #impact-copy{position:absolute;top:42%;left:0;right:0;font-size:38px;font-style:italic}
    #report{background:#e7e4db;color:#222;overflow:auto}
    #report-content{position:absolute;top:18%;left:28px;right:28px}
    #main-phrase{font-size:48px;line-height:.95;max-width:700px;color:#ef4a2b;margin:0 0 24px}
    #data{font-size:24px;line-height:1.1;max-width:700px}
    .repeat{position:absolute;top:28px;right:28px;display:block;margin:0;padding:0;border:0;color:#b20f17;background:none;font-size:16px;text-decoration:underline;text-align:right}
    #note{position:absolute;left:28px;right:28px;bottom:20px;font:11px/1.3 monospace;color:#4b555d}
  </style>
  <script type="text/javascript">
    function showImpact(){document.getElementById('splash').style.display='none';document.getElementById('impact').style.display='block';window.setTimeout(showReport,3300)}
    function showReport(){document.getElementById('impact').style.display='none';document.getElementById('report').style.display='block'}
    function resetPage(){document.getElementById('report').style.display='none';document.getElementById('impact').style.display='none';document.getElementById('splash').style.display='block'}
  </script>
</head>
<body>
  <div id="experience">
    <div id="splash" class="screen" onclick="showImpact()"><div id="typography"></div><div id="hint">tocá para continuar</div></div>
    <div id="impact" class="screen"><div id="impact-copy">... todavía no acabé...</div></div>
    <div id="report" class="screen">
      <div id="report-content"><p id="main-phrase">No sabés todo lo que aún te puedo enseñar</p><p id="data">Los dispositivos descartados pueden volver a las escuelas para enseñar.</p><a class="repeat" href="#" onclick="resetPage();return false">De nuevo</a></div>
      <div id="note">Versión básica para Safari antiguo. Sin animaciones ni transiciones.</div>
    </div>
  </div>
</body>
</html>
